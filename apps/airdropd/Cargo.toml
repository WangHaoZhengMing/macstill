[package]
name="macstill-airdropd"
version.workspace=true
edition.workspace=true
license.workspace=true
[dependencies]
macstill-airdrop={path="../../crates/macstill-airdrop"}
anyhow.workspace=true
serde_json.workspace=true
tokio={version="1",features=["macros","rt-multi-thread","sync","time","signal","net","fs"]}
zbus={version="5",default-features=false,features=["tokio"]}
rustls={version="0.23",default-features=false,features=["ring","std","tls12"]}
getrandom="0.3"
#[dev] tests use only an isolated D-Bus and IPv6 loopback.
owly-airdrop={git="https://github.com/t4t5/owly",rev="f077e352801243927054cbcb452ac55b83dc1c70",features=["mdns"]}

futures-util = "0.3"

[dev-dependencies]
tempfile.workspace=true

