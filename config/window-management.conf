# Legacy hyprlang floating desktop. Define $macstill before sourcing this file.
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(85858b80)
    col.inactive_border = rgba(55555b40)
    resize_on_border = true
}
input {
    follow_mouse = 0
    float_switch_override_focus = 0
}
decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        contrast = 0.95
        brightness = 1.0
        vibrancy = 0.18
        vibrancy_darkness = 0.0
        noise = 0.012
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000038)
        color_inactive = rgba(00000020)
        offset = 0 6
    }
}
misc {
    focus_on_activate = true
    animate_manual_resizes = false
}
cursor {
    no_warps = true
}
windowrule {
    name = macstill-floating-desktop
    match:class = .*
    float = true
}
bezier = macstillEase, 0.2, 0.8, 0.2, 1.0
windowrule {
    name = macstill-settings-material
    match:class = ^org[.]macstill[.]Settings$
    rounding = 12
    border_size = 0
    no_shadow = false
    no_blur = false
    xray = false
    opacity = 1.0 override 1.0 override
}
windowrule {
    name = macstill-finder-material
    match:class = ^org[.]macstill[.]Finder$
    rounding = 12
    border_size = 0
    no_shadow = false
    no_blur = false
    xray = false
    opacity = 1.0 override 1.0 override
}
animations {
    enabled = true
    animation = windowsIn, 1, 2.2, macstillEase, popin 96%
    animation = windowsOut, 1, 1.6, macstillEase, popin 96%
    animation = windowsMove, 1, 2.5, macstillEase
    animation = fade, 1, 1.8, macstillEase
    animation = workspaces, 1, 3, macstillEase, slide
}
bind = SUPER, TAB, exec, $macstill window next
bind = SUPER SHIFT, TAB, exec, $macstill window previous
bind = SUPER, grave, exec, $macstill window same-app
bind = SUPER ALT, LEFT, exec, $macstill window left
bind = SUPER ALT, RIGHT, exec, $macstill window right
bind = SUPER ALT, C, exec, $macstill window center
bind = SUPER ALT, UP, exec, $macstill window maximize
bind = SUPER CTRL, F, exec, $macstill window fullscreen
bind = SUPER, W, exec, $macstill window close
bind = SUPER ALT, T, exec, $macstill window float
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# MPRIS media controls
bind = , XF86AudioPlay, exec, $macstill media play-pause
bind = , XF86AudioPause, exec, $macstill media pause
bind = , XF86AudioStop, exec, $macstill media stop
bind = , XF86AudioNext, exec, $macstill media next
bind = , XF86AudioPrev, exec, $macstill media previous

# Shell-owned transitions (no compositor pop/slide on these layer surfaces).
layerrule = noanim, macstill-bar
layerrule = noanim, macstill-desktop
layerrule = noanim, macstill-launchpad
layerrule = noanim, macstill-control-center
layerrule = noanim, macstill-apple-menu
layerrule = noanim, macstill-tray

layerrule = blur, macstill-bar
layerrule = ignorealpha 0.05, macstill-bar
layerrule = blur, macstill-dock
layerrule = ignorealpha 0.05, macstill-dock
layerrule = blur, macstill-launchpad
layerrule = ignorealpha 0.05, macstill-launchpad
layerrule = blur, macstill-control-center
layerrule = ignorealpha 0.05, macstill-control-center
layerrule = blur, macstill-notification-center
layerrule = ignorealpha 0.05, macstill-notification-center
layerrule = blur, macstill-notification-banner
layerrule = ignorealpha 0.05, macstill-notification-banner
layerrule = blur, macstill-apple-menu
layerrule = ignorealpha 0.05, macstill-apple-menu
layerrule = blur, macstill-tray
layerrule = ignorealpha 0.05, macstill-tray
layerrule = blur, macstill-stage-manager
layerrule = ignorealpha 0.05, macstill-stage-manager

# Screenshot is a separate application.
bind = SUPER SHIFT, 3, exec, $macstill screenshot --fullscreen
bind = SUPER SHIFT, 4, exec, $macstill screenshot --region
bind = SUPER SHIFT, 5, exec, $macstill screenshot
bind = SUPER CTRL SHIFT, 3, exec, $macstill screenshot --fullscreen --clipboard
bind = SUPER CTRL SHIFT, 4, exec, $macstill screenshot --region --clipboard
layerrule = noanim, macstill-screenshot
layerrule = noanim, macstill-screenshot-preview

# Mission Control. Legacy Hyprlang gestures invoke the transition on release.
bind = CTRL, up, exec, $macstill mission-control toggle
bind = SUPER, F3, exec, $macstill mission-control toggle
bind = , XF86LaunchA, exec, $macstill mission-control toggle
bind = CTRL, left, exec, $macstill mission-control previous
bind = CTRL, right, exec, $macstill mission-control next
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, $macstill mission-control open
gesture = 3, down, dispatcher, exec, $macstill mission-control close
layerrule = noanim, macstill-mission-control

# Swipes only navigate existing desktops.
gestures {
    workspace_swipe_create_new = false
}
