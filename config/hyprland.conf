# Add these lines to your existing Hyprland configuration after installing locally.
# Floating-desktop profile installed by scripts/install-local.sh.
$macstill = ~/.local/bin/macstill
source = ~/.config/macstill/hyprland/window-management.conf
exec-once = ~/.local/bin/macstill shell
bind = SUPER, SPACE, exec, ~/.local/bin/macstill launchpad
bind = SUPER, comma, exec, ~/.local/bin/macstill settings
# Macstill publishes namespaces macstill-bar, macstill-dock, macstill-desktop and macstill-launchpad.
# Add compositor blur rules using the syntax supported by YOUR Hyprland release.
